name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The three targets a release ships, so a platform-specific
          # assumption fails a test rather than reaching one.
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-aarch64
            runner: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-spinel

      # The pins live in scripts/vendor.sh, so the script is the cache key: a
      # re-pin misses the cache and fetches, and nothing else does.
      - name: Restore vendored sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/vendor.sh') }}

      - name: Fetch the tree-sitter runtime and grammar
        run: ./scripts/vendor.sh

      # Not folded into vendor.sh: that script's contents key the cache above,
      # and a revision moving with every commit would invalidate it.
      - name: Stamp the build revision
        run: ./scripts/build_rev.sh

      - name: Run tests
        run: '"$SPIN" test'

      # The binding owns its record format on its own terms, and holding it
      # needs neither the runtime nor a grammar.
      - name: Test the tree-sitter binding
        run: cd .packages/tree-sitter && "$SPIN" test

      # `spin test` compiles test/*.rb at -O1 and never bin/, so the
      # configuration that ships is exercised only here. Running it, not
      # only building it, is what puts that configuration under test.
      #
      # The revision is the only cover bin/ has: a test never sees a stamped
      # one, so nothing but this notices the wiring coming loose.
      - name: Build and run the executable
        run: |
          "$SPIN" build
          got=$(./build/bin/sumi -v)
          echo "$got"
          echo "$got" | grep -Eq '\([0-9a-f]{7}\)$' \
            || { echo "::error::the executable was not stamped: $got"; exit 1; }

      # Dogfooding is a promise this repository makes about itself, and a
      # promise nobody executes is one that rots quietly. This is also the only
      # step that runs a mechanism over a real project rather than a fixture.
      - name: Verify this repository against its own specification
        run: ./build/bin/sumi verify
