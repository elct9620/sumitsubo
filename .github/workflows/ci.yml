name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The three targets CD ships, so a platform-specific
          # assumption fails a test rather than reaching a release.
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-aarch64
            runner: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-spinel

      - name: Run tests
        run: '"$SPIN" test'

      # `spin test` compiles test/*.rb at -O1 and never bin/, so the
      # configuration that ships is exercised only here. Running it, not
      # only building it, is what puts that configuration under test.
      - name: Build and run the executable
        run: |
          "$SPIN" build
          ./build/bin/sumi -v
