name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: >-
          The release tag to build and attach executables to. A tag pushed by
          hand arrives on the trigger above; one pushed by release-please
          cannot, so the release chain hands it in here.
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One runner per target: `spin build` on the native host is
          # the whole build, so no cross toolchain is involved. Windows
          # has no entry — the runtime depends on POSIX structurally.
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-aarch64
            runner: macos-latest

    steps:
      # The tag, not the branch it sits on: a release chained from main would
      # otherwise build whatever landed after it and stamp a revision the
      # release never named.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup-spinel

      # The pins live in scripts/vendor.sh, so the script is the cache key: a
      # re-pin misses the cache and fetches, and nothing else does.
      - name: Restore vendored sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/vendor.sh') }}

      - name: Fetch the tree-sitter runtime and grammar
        run: ./scripts/vendor.sh

      # Not folded into vendor.sh: that script's contents key the cache above,
      # and a revision moving with every commit would invalidate it.
      - name: Stamp the build revision
        run: ./scripts/build_rev.sh

      - name: Build executable
        run: '"$SPIN" build'

      - name: Smoke-run the executable
        # Through a flag rather than the empty-argument default: both reach
        # the CLI, but an argument shows the parser ran. An unstamped
        # revision means the artifact cannot say which commit it came from,
        # which is the whole reason a release build carries one.
        run: |
          got=$(./build/bin/sumi -v)
          echo "$got"
          echo "$got" | grep -Eq '\([0-9a-f]{7}\)$' \
            || { echo "::error::the executable was not stamped: $got"; exit 1; }

      - name: Record artifact shape
        run: |
          set -euo pipefail
          bin=build/bin/sumi
          {
            echo "### ${{ matrix.name }}"
            echo
            echo '```'
            file "$bin"
            ls -lh "$bin" | awk '{print "size: " $5}'
            # What the executable still needs from the host is what
            # decides whether it is usable outside this runner.
            if [ "$RUNNER_OS" = "macOS" ]; then otool -L "$bin"; else ldd "$bin" || true; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sumi-${{ matrix.name }}
          path: build/bin/sumi
          if-no-files-found: error

  # release-please tags a release and leaves it empty; this is what puts the
  # executables on it. A bare workflow_dispatch builds from a branch head and
  # names no release, so it stops after the artifacts above.
  attach:
    name: attach the executables to the release
    needs: build
    if: ${{ inputs.tag || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sumi-*
          path: dist

      # An artifact hands the file back without its mode, so each one is
      # installed executable under a name carrying the version and the target
      # it answers for — a release holds all three side by side.
      - name: Attach the executables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p upload
          for dir in dist/sumi-*; do
            install -m 755 "$dir/sumi" "upload/sumi-${version}-${dir#dist/sumi-}"
          done
          ls -l upload
          gh release upload "$TAG" upload/* --clobber
