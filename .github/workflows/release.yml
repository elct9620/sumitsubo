name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: >-
          The release tag to build and attach executables to. A tag pushed by
          hand arrives on the trigger above; one pushed by release-please
          cannot, so the release chain hands it in here.
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One runner per target: `spin build` on the native host is
          # the whole build, so no cross toolchain is involved. Windows
          # has no entry — the runtime depends on POSIX structurally.
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-aarch64
            runner: macos-latest

    steps:
      # The tag, not the branch it sits on: a release chained from main would
      # otherwise build whatever landed after it and stamp a revision the
      # release never named.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup-spinel

      # The pins live in scripts/vendor.sh, so the script is the cache key: a
      # re-pin misses the cache and fetches, and nothing else does.
      - name: Restore vendored sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/vendor.sh') }}

      - name: Fetch the tree-sitter runtime and grammar
        run: ./scripts/vendor.sh

      # Not folded into vendor.sh: that script's contents key the cache above,
      # and a revision moving with every commit would invalidate it.
      - name: Stamp the build revision
        run: ./scripts/build_rev.sh

      - name: Build executable
        run: '"$SPIN" build'

      - name: Smoke-run the executable
        # Through a flag rather than the empty-argument default: both reach
        # the CLI, but an argument shows the parser ran. An unstamped
        # revision means the artifact cannot say which commit it came from,
        # which is the whole reason a release build carries one.
        run: |
          got=$(./build/bin/sumi -v)
          echo "$got"
          echo "$got" | grep -Eq '\([0-9a-f]{7}\)$' \
            || { echo "::error::the executable was not stamped: $got"; exit 1; }

      - name: Record artifact shape
        run: |
          set -euo pipefail
          bin=build/bin/sumi
          {
            echo "### ${{ matrix.name }}"
            echo
            echo '```'
            file "$bin"
            ls -lh "$bin" | awk '{print "size: " $5}'
            # What the executable still needs from the host is what
            # decides whether it is usable outside this runner.
            if [ "$RUNNER_OS" = "macOS" ]; then otool -L "$bin"; else ldd "$bin" || true; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sumi-${{ matrix.name }}
          path: build/bin/sumi
          if-no-files-found: error

  # release-please tags a release and leaves it empty; this is what puts the
  # executables on it. A bare workflow_dispatch builds from a branch head and
  # names no release, so it stops after the artifacts above.
  attach:
    name: attach the executables to the release
    needs: build
    if: ${{ inputs.tag || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sumi-*
          path: dist

      # Neither an artifact nor a release asset carries a file mode, and a
      # download nobody can run without a chmod is not the executable this
      # ships. A tar carries the mode, so that is what a release holds: one
      # per target, named for the version and the target it answers for.
      - name: Attach the executables and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p upload
          for dir in dist/sumi-*; do
            chmod 755 "$dir/sumi"
            tar czf "upload/sumi-${version}-${dir#dist/sumi-}.tar.gz" -C "$dir" sumi
          done
          # GitHub computes a digest of its own, but only the API answers with
          # it — a person holding curl has nothing to compare against. The names
          # go in bare so the file verifies wherever the tarballs were downloaded.
          (cd upload && sha256sum *.tar.gz > "sumi-${version}-checksums.txt")
          ls -l upload
          gh release upload "$TAG" upload/* --clobber

  # The same executables, assembled into an image so a machine with no way to
  # run one natively still has a way to run `sumi` — Windows above all. Nothing
  # is compiled here: the image carries the bytes the tarballs carry.
  #
  # One runner per architecture, as the build above: the executable is run to
  # prove the image holds it, and running it under emulation would prove only
  # that the emulator can. Unlike `attach` the job is not gated as a whole —
  # a bare workflow_dispatch reaches everything except the push, which is what
  # makes this the one place the image can be tried before a release names it.
  docker:
    name: image (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sumi-${{ matrix.name }}
          path: dist/sumi-${{ matrix.name }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The image is built and run before anything is pushed. Its libraries come
      # from a base that has to carry a glibc no older than the one the
      # executable was linked against, and the two drifting apart breaks an
      # image that still builds — nothing else here would notice.
      - name: Build the image and run what it holds
        run: |
          set -euo pipefail
          docker buildx build --load -t sumi:probe -f Dockerfile dist
          docker run --rm sumi:probe -v
          # This tree is what the image is pointed at, so a `verify` here
          # reaches a grammar and every mechanism. It answering at all is the
          # proof; `1` is a specification that moved, which is CI's to report.
          answer=0
          docker run --rm -v "$PWD:/work:ro" sumi:probe verify || answer=$?
          [ "$answer" -le 1 ] || { echo "::error::the image could not verify a tree"; exit 1; }

      # Pushed without a tag of its own: an architecture is half of what an
      # operator pulls, and naming it would leave that half standing in the
      # registry after the two are joined below.
      - name: Push this architecture by digest
        if: ${{ inputs.tag || github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker buildx build -f Dockerfile dist \
            --output "type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json
          mkdir -p digests
          touch "digests/$(jq -r '."containerimage.digest"' metadata.json | cut -d: -f2)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ inputs.tag || github.ref_type == 'tag' }}
        with:
          name: digest-${{ matrix.name }}
          path: digests/*
          if-no-files-found: error

  # The two architectures joined into the one name an operator pulls. `latest`
  # is left alone while the versions are previews: what it should point at is a
  # decision the real 0.1.0 gets to make.
  manifest:
    name: join the architectures under one tag
    needs: docker
    if: ${{ inputs.tag || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Create the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker buildx imagetools create --tag "$IMAGE:${TAG#v}" \
            $(cd digests && printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${TAG#v}"
