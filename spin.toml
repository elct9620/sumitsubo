# A `.c` enters this build by being listed here, the way a `.rb` enters by
# being required: `sources` is the whole of what this application carries.
#
# The binding's own C is declared in its own manifest, and the dot in
# `.packages` is what keeps spin from reading that file as an undeclared
# source of this application as well.
[package]
name = "sumitsubo"
sources = ["grammars/*.c"]

[dependencies]
treesitter = { path = ".packages/tree-sitter" }
